name: Build Windows App

# Builds the downloadable Windows program automatically.
# - Runs on every push to the development branch and on demand.
# - The finished .exe is attached to the run as a downloadable artifact.
# - Pushing a version tag (e.g. v1.0.0) also publishes a GitHub Release.

on:
  push:
    branches:
      - claude/affectionate-bell-ou99cm
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build the executable
        run: pyinstaller --noconfirm --clean OperationsAssistant.spec

      - name: Upload the program as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperationsAssistant-windows
          path: dist/OperationsAssistant.exe
          if-no-files-found: error

      - name: Publish a Release (only when a version tag is pushed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OperationsAssistant.exe
