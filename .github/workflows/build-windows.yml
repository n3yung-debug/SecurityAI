name: Build Windows App

# Builds the downloadable Windows program automatically.
# - Runs on pushes to main / the dev branch, on version tags, and on demand.
# - The finished .exe is attached to the run as a downloadable artifact.
# - On main, on a version tag, or when run manually, it also publishes a
#   GitHub Release so the .exe is downloadable from the repo's home page.

on:
  push:
    branches:
      - main
      - claude/affectionate-bell-ou99cm
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build the executable
        run: pyinstaller --noconfirm --clean OperationsAssistant.spec

      - name: Upload the program as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperationsAssistant-windows
          path: dist/OperationsAssistant.exe
          if-no-files-found: error

      - name: Publish a Release (downloadable from the repo home page)
        if: >-
          github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/tags/v')
          || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On a version tag use that tag; otherwise publish/refresh v1.0.0.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: Operations Assistant ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          body: |
            Download **OperationsAssistant.exe** below (under *Assets*) and run it on the host PC.
            See the README for setup. Windows SmartScreen may warn about an unknown publisher — choose **More info → Run anyway**.
          files: dist/OperationsAssistant.exe
