name: Build Windows App

# Builds the downloadable Windows program automatically.
# - Runs on pushes to main / the dev branch, on version tags, and on demand.
# - The finished .exe is attached to the run as a downloadable artifact.
# - Releases are versioned. The version is read from the VERSION file; a new
#   GitHub Release (v<VERSION>) is published only when that version doesn't
#   already exist, so every released version is preserved on the home page.
#   Pushing a git tag like v1.2.0 also publishes that exact version.

on:
  push:
    branches:
      - main
      - claude/affectionate-bell-ou99cm
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to detect existing versions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build the executable
        run: pyinstaller --noconfirm --clean OperationsAssistant.spec

      - name: Upload the program as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperationsAssistant-windows
          path: dist/OperationsAssistant.exe
          if-no-files-found: error

      # ---- Versioned releases ----------------------------------------
      - name: Work out the version
        id: ver
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          git fetch --tags --quiet || true
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$version already exists; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing new release v$version."
          fi

      - name: Publish new version (from VERSION file)
        if: >-
          (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
          && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Operations Assistant ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/OperationsAssistant.exe

      - name: Publish tagged version (from a pushed git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Operations Assistant ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/OperationsAssistant.exe
